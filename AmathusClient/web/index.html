<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Cyprus Bicommunal News | Kıbrıs Haber | Ειδήσεις Κύπρου">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cyprus Bicommunal News">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cyprus Bicommunal News</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F4F6F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background-color: #F4F6F9;
      z-index: 99999;
      transition: opacity 0.18s ease-out;
    }
    #app-splash-bar {
      height: 56px;
      background-color: #0F2942;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
      box-shadow: 0 1px 3px rgba(15, 41, 66, 0.15);
    }
    #app-splash-bar img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
    }
    #app-splash-offline {
      display: none;
      width: 100%;
      box-sizing: border-box;
      background-color: #FEE2E2;
      border-bottom: 1px solid #FCA5A5;
      color: #991B1B;
      font-size: 12.5px;
      font-weight: 700;
      text-align: center;
      padding: 7px 14px;
    }
    #app-splash-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
    }
    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(15, 41, 66, 0.15);
      border-top-color: #0F2942;
      border-radius: 50%;
      animation: amathus-spin 0.75s linear infinite;
    }
    @keyframes amathus-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-splash">
    <div id="app-splash-bar">
      <img src="icons/Icon-192.png" alt="" />
      <span>Cyprus Bicommunal News</span>
    </div>
    <div id="app-splash-offline">Offline mode — showing cached news &amp; podcast</div>
    <div id="app-splash-body">
      <div class="splash-spinner"></div>
    </div>
  </div>
  <script>
    function syncSplashOfflineBanner() {
      var banner = document.getElementById('app-splash-offline');
      if (!banner) return;
      var isOffline = window.navigator && window.navigator.onLine === false;
      banner.style.display = isOffline ? 'block' : 'none';
    }
    syncSplashOfflineBanner();
    window.addEventListener('offline', syncSplashOfflineBanner);
    window.addEventListener('online', syncSplashOfflineBanner);

    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('app-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 180);
      }
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        try {
          navigator.serviceWorker.controller.postMessage({ type: 'WARM_CACHE' });
        } catch (_) {}
      }
    });

    window._deferredPwaPrompt = null;
    window._isPwaInstalled = false;

    function detectPlatformHint() {
      const ua = (window.navigator && window.navigator.userAgent) || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (window.navigator.platform === 'MacIntel' && window.navigator.maxTouchPoints > 1);
      if (isIOS) return 'ios';
      const isSafari = /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(ua);
      if (isSafari) return 'safari';
      return 'browser';
    }

    function detectIsStandalone() {
      if (window._isPwaInstalled) return true;
      const mq = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
      const iosStandalone = window.navigator && window.navigator.standalone === true;
      return Boolean(mq || iosStandalone);
    }

    function syncPwaDataset() {
      const root = document.documentElement;
      if (!root) return;
      root.dataset.pwaStandalone = detectIsStandalone() ? 'true' : 'false';
      root.dataset.pwaHasPrompt = window._deferredPwaPrompt ? 'true' : 'false';
      root.dataset.pwaPlatform = detectPlatformHint();
    }

    syncPwaDataset();

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window._deferredPwaPrompt = e;
      syncPwaDataset();
      window.dispatchEvent(new Event('pwa-install-change'));
    });

    window.addEventListener('appinstalled', function() {
      window._deferredPwaPrompt = null;
      window._isPwaInstalled = true;
      syncPwaDataset();
      window.dispatchEvent(new Event('pwa-install-change'));
    });

    window.addEventListener('amathus-trigger-pwa-install', async function() {
      const root = document.documentElement;
      const promptEvent = window._deferredPwaPrompt;
      if (!promptEvent) {
        if (root) root.dataset.pwaLastOutcome = 'unavailable';
        window.dispatchEvent(new Event('amathus-pwa-prompt-done'));
        return;
      }
      try {
        promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        if (choice && choice.outcome === 'accepted') {
          window._deferredPwaPrompt = null;
          window._isPwaInstalled = true;
          syncPwaDataset();
          if (root) root.dataset.pwaLastOutcome = 'accepted';
        } else {
          if (root) root.dataset.pwaLastOutcome = 'dismissed';
        }
      } catch (_) {
        if (root) root.dataset.pwaLastOutcome = 'unavailable';
      }
      window.dispatchEvent(new Event('pwa-install-change'));
      window.dispatchEvent(new Event('amathus-pwa-prompt-done'));
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('offline_sw.js').catch(function() {});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
